---
name: firewall
resources:

  # os-firewall resources

  - name: Filter
    filename: filter
    monad: rule
    endpoints:
      create:
        path: "/firewall/filter/addRule"
        method: POST
      read:
        path: "/firewall/filter/getRule"
        method: GET
      update:
        path: "/firewall/filter/setRule"
        method: POST
      delete:
        path: "/firewall/filter/delRule"
        method: POST
      reconfigure:
        path: "/firewall/filter/apply"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: SortOrder
        type: string
        key: sort_order
      - name: Sequence
        type: string
        key: sequence
      - name: Categories
        type: SelectedMapList
        key: categories
      - name: NoXMLRPCSync
        type: string
        key: nosync
      - name: Description
        type: string
        key: description
      - name: InvertInterface
        type: string
        key: interfacenot
      - name: Interface
        type: SelectedMapList
        key: interface
      - name: Quick
        type: string
        key: quick
      - name: Action
        type: SelectedMap
        key: action
      - name: AllowOptions
        type: string
        key: allowopts
      - name: Direction
        type: SelectedMap
        key: direction
      - name: IPProtocol
        type: SelectedMap
        key: ipprotocol
      - name: Protocol
        type: SelectedMap
        key: protocol
      - name: ICMPType
        type: SelectedMapList
        key: icmptype
      - name: SourceInvert
        type: string
        key: source_not
      - name: SourceNet
        type: string
        key: source_net
      - name: SourcePort
        type: string
        key: source_port
      - name: DestinationInvert
        type: string
        key: destination_not
      - name: DestinationNet
        type: string
        key: destination_net
      - name: DestinationPort
        type: string
        key: destination_port
      - name: Log
        type: api.BoolString
        key: log
      - name: TCPFlags
        type: SelectedMapList
        key: tcpflags1
      - name: TCPFlagsOutOf
        type: SelectedMapList
        key: tcpflags2
      - name: Schedule
        type: SelectedMap
        key: sched
      - name: StateType
        type: SelectedMap
        key: statetype
      - name: StatePolicy
        type: SelectedMap
        key: state-policy
      - name: StateTimeout
        type: string
        key: statetimeout
      - name: AdaptiveTimeoutsStart
        type: string
        key: adaptivestart
      - name: AdaptiveTimeoutsEnd
        type: string
        key: adaptiveend
      - name: MaxStates
        type: string
        key: max
      - name: MaxSourceNodes
        type: string
        key: max-src-nodes
      - name: MaxSourceStates
        type: string
        key: max-src-states
      - name: MaxSourceConnections
        type: string
        key: max-src-conn
      - name: MaxNewConnectionsCount
        type: string
        key: max-src-conn-rate
      - name: MaxNewConnectionsSeconds
        type: string
        key: max-src-conn-rates
      - name: OverloadTable
        type: SelectedMap
        key: overload
      - name: NoPfsync
        type: string
        key: nopfsync
      - name: TrafficShaper
        type: SelectedMap
        key: shaper1
      - name: TrafficShaperReverse
        type: SelectedMap
        key: shaper2
      - name: Gateway
        type: SelectedMap
        key: gateway
      - name: DisableReplyTo
        type: string
        key: disablereplyto
      - name: ReplyTo
        type: SelectedMap
        key: replyto
      - name: MatchPriority
        type: SelectedMap
        key: prio
      - name: SetPriority
        type: SelectedMap
        key: set-prio
      - name: SetPriorityLowDelay
        type: SelectedMap
        key: set-prio-low
      - name: MatchTOS
        type: SelectedMap
        key: tos
      - name: SetLocalTag
        type: string
        key: tag
      - name: MatchLocalTag
        type: string
        key: tagged

  - name: NAT
    filename: nat
    monad: rule
    endpoints:
      create:
        path: "/firewall/source_nat/addRule"
        method: POST
      read:
        path: "/firewall/source_nat/getRule"
        method: GET
      update:
        path: "/firewall/source_nat/setRule"
        method: POST
      delete:
        path: "/firewall/source_nat/delRule"
        method: POST
      reconfigure:
        path: "/firewall/source_nat/apply"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: DisableNAT
        type: string
        key: nonat
      - name: Sequence
        type: string
        key: sequence
      - name: Interface
        type: SelectedMap
        key: interface
      - name: IPProtocol
        type: SelectedMap
        key: ipprotocol
      - name: Protocol
        type: SelectedMap
        key: protocol
      - name: SourceNet
        type: string
        key: source_net
      - name: SourcePort
        type: string
        key: source_port
      - name: SourceInvert
        type: string
        key: source_not
      - name: DestinationNet
        type: string
        key: destination_net
      - name: DestinationPort
        type: string
        key: destination_port
      - name: DestinationInvert
        type: string
        key: destination_not
      - name: Target
        type: string
        key: target
      - name: TargetPort
        type: string
        key: target_port
      - name: Log
        type: string
        key: log
      - name: Description
        type: string
        key: description

  - name: NatOneToOne
    filename: nat_one_to_one
    monad: rule
    endpoints:
      create:
        path: "/firewall/one_to_one/addRule"
        method: POST
      read:
        path: "/firewall/one_to_one/getRule"
        method: GET
      update:
        path: "/firewall/one_to_one/setRule"
        method: POST
      delete:
        path: "/firewall/one_to_one/delRule"
        method: POST
      reconfigure:
        path: "/firewall/one_to_one/apply"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Log
        type: string
        key: log
      - name: Sequence
        type: string
        key: sequence
      - name: Interface
        type: SelectedMap
        key: interface
      - name: Type
        type: SelectedMap
        key: type
      - name: SourceNet
        type: string
        key: source_net
      - name: SourceInvert
        type: string
        key: source_not
      - name: DestinationNet
        type: string
        key: destination_net
      - name: DestinationInvert
        type: string
        key: destination_not
      - name: ExternalNet
        type: string
        key: external
      - name: NatReflection
        type: SelectedMap
        key: natreflection
      - name: Categories
        type: SelectedMapList
        key: categories
      - name: Description
        type: string
        key: description
      

  # core firewall resources

  - name: Alias
    filename: alias
    monad: alias
    endpoints:
      create:
        path: "/firewall/alias/addItem"
        method: POST
      read:
        path: "/firewall/alias/getItem"
        method: GET
      update:
        path: "/firewall/alias/setItem"
        method: POST
      delete:
        path: "/firewall/alias/delItem"
        method: POST
      reconfigure:
        path: "/firewall/alias/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Name
        type: string
        key: name
      - name: Type
        type: SelectedMap
        key: type
      - name: IPProtocol # only when type = asn, geoip, external
        type: SelectedMapList
        key: proto
      - name: Interface # only when type = dynipv6host
        type: SelectedMap
        key: interface
      - name: Content # NOT when type = external, ISO 3166-1 country code when type = geoip, __<int>_network when type = networkgroup, openvpn group when type = authgroup
        type: SelectedMapListNL
        key: content
      - name: Categories
        type: SelectedMapList
        key: categories
      - name: UpdateFreq # only when type = urltable
        type: string
        key: updatefreq
      - name: PathExpression # only when type = urljson
        type: string
        key: path_expression
      - name: Statistics # not when type = port
        type: string
        key: counters
      - name: Description
        type: string
        key: description

  - name: Category
    filename: category
    monad: category
    endpoints:
      create:
        path: "/firewall/category/addItem"
        method: POST
      read:
        path: "/firewall/category/getItem"
        method: GET
      update:
        path: "/firewall/category/setItem"
        method: POST
      delete:
        path: "/firewall/category/delItem"
        method: POST
    attrs:
      - name: Automatic
        type: string
        key: auto
      - name: Name
        type: string
        key: name
      - name: Color
        type: string
        key: color

  - name: Group
    filename: group
    monad: group
    endpoints:
      create:
        path: "/firewall/group/addItem"
        method: POST
      read:
        path: "/firewall/group/getItem"
        method: GET
      update:
        path: "/firewall/group/setItem"
        method: POST
      delete:
        path: "/firewall/group/delItem"
        method: POST
      search:
        path: "/firewall/group/searchItem"
        method: POST
      reconfigure:
        path: "/firewall/group/reconfigure"
        method: POST
    attrs:
      - name: UUID
        type: string
        key: uuid
        omitEmpty: true
      - name: Name
        type: string
        key: ifname
      - name: Members
        type: SelectedMapList
        key: members
      - name: NoGroup
        type: string
        key: nogroup
      - name: Sequence
        type: string
        key: sequence
      - name: Description
        type: string
        key: descr

  - name: Npt
    filename: npt
    monad: rule
    endpoints:
      create:
        path: "/firewall/npt/addRule"
        method: POST
      read:
        path: "/firewall/npt/getRule"
        method: GET
      update:
        path: "/firewall/npt/setRule"
        method: POST
      delete:
        path: "/firewall/npt/delRule"
        method: POST
      search:
        path: "/firewall/npt/searchRule"
        method: POST
      reconfigure:
        path: "/firewall/npt/apply"
        method: POST
    attrs:
      - name: UUID
        type: string
        key: uuid
        omitEmpty: true
      - name: Enabled
        type: string
        key: enabled
      - name: Log
        type: string
        key: log
      - name: Sequence
        type: string
        key: sequence
      - name: Categories
        type: SelectedMapList
        key: categories
      - name: Description
        type: string
        key: description
      - name: Interface
        type: SelectedMap
        key: interface
      - name: SourceNet
        type: string
        key: source_net
      - name: DestinationNet
        type: string
        key: destination_net
      - name: TrackInterface
        type: SelectedMap
        key: trackif
rpc:
  - name: SourceNATSettings
    filename: source_nat_settings
    customTypes:
      SourceNATSettingsResponse:
        - name: Filter
          type: SourceNATSettings
          key: filter
      SourceNATSettings:
        - name: General
          type: SourceNATGeneralSettings
          key: general
      SourceNATGeneralSettings:
        - name: Mode
          type: SelectedMap
          key: snat_mode
      SourceNATApplyResult:
        - name: Status
          type: string
          key: status
    rpc_calls:
      - name: Get
        endpoint:
          path: "/firewall/source_nat/get"
          method: GET
        result_type: SourceNATSettingsResponse
      - name: Set
        endpoint:
          path: "/firewall/source_nat/set"
          method: POST
        params:
          - name: filter
            optional: false
            bodyParameter: true
            customType: SourceNATSettings
        result_type: api.ActionResult
      - name: Apply
        endpoint:
          path: "/firewall/source_nat/apply"
          method: POST
        result_type: SourceNATApplyResult
