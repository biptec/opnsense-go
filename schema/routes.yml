---
name: routes
resources:
  - name: Route
    filename: route
    monad: route
    endpoints:
      create:
        path: "/routes/routes/addroute"
        method: POST
      read:
        path: "/routes/routes/getroute"
        method: GET
      update:
        path: "/routes/routes/setroute"
        method: POST
      delete:
        path: "/routes/routes/delroute"
        method: POST
      reconfigure:
        path: "/routes/routes/reconfigure"
        method: POST
    attrs:
      # OPNsense 26.1.10 (core #10027) renamed this field from 'disabled'
      # to 'enabled'. Enabled is the canonical field; Disabled is kept only
      # for backwards compatibility with pre-26.1.10 releases. Consumers
      # should write both (each version ignores the key it doesn't know)
      # and read Enabled, falling back to Disabled when Enabled is empty.
      - name: Enabled
        type: string
        key: enabled
      - name: Disabled # deprecated: pre-26.1.10 compatibility only
        type: string
        key: disabled
      - name: Description
        type: string
        key: descr
      - name: Gateway
        type: SelectedMap
        key: gateway
      - name: Network
        type: string
        key: network
