---
name: api_extensions
resources:
  - name: CarpHealthCheck
    filename: carp_health_check
    monad: check
    endpoints:
      create:
        path: "/api_extensions/carp_health/addCheck"
        method: POST
      read:
        path: "/api_extensions/carp_health/getCheck"
        method: GET
      update:
        path: "/api_extensions/carp_health/setCheck"
        method: POST
      delete:
        path: "/api_extensions/carp_health/delCheck"
        method: POST
      search:
        path: "/api_extensions/carp_health/searchCheck"
        method: GET
      reconfigure:
        path: "/api_extensions/carp_health/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: api.BoolString
        key: enabled
      - name: Name
        type: string
        key: name
      - name: Interface
        type: SelectedMap
        key: interface
      - name: Target
        type: string
        key: target
      - name: Scope
        type: SelectedMap
        key: scope
      - name: VHID
        type: string
        key: vhid
      - name: FailureAdvSkew
        type: string
        key: failure_advskew
      - name: VHIDTargets
        type: SelectedMapList
        key: vhid_targets
      - name: FallbackIPv4Target
        type: string
        key: fallback_ipv4_target
      - name: FallbackIPv4Gateway
        type: string
        key: fallback_ipv4_gateway
      - name: FallbackIPv6Target
        type: string
        key: fallback_ipv6_target
      - name: FallbackIPv6Gateway
        type: string
        key: fallback_ipv6_gateway
      - name: FallbackIPv4DefaultGateway
        type: string
        key: fallback_ipv4_default_gateway
      - name: FallbackIPv6DefaultGateway
        type: string
        key: fallback_ipv6_default_gateway

rpc:
  - name: "Webgui"
    filename: webgui
    customTypes:
      WebguiSettings:
        - name: Protocol
          type: string
          key: protocol
        - name: Port
          type: int
          key: port
        - name: Interfaces
          type: '[]string'
          key: interfaces
        - name: CertificateRef
          type: string
          key: certificate_ref
        - name: SessionTimeout
          type: '*int'
          key: session_timeout
        - name: HSTS
          type: bool
          key: hsts
        - name: DisableHTTPRedirect
          type: bool
          key: disable_http_redirect
        - name: AlternateHostnames
          type: '[]string'
          key: alternate_hostnames
      WebguiResponse:
        - name: Webgui
          type: WebguiSettings
          key: webgui
      WebguiActionResult:
        - name: Status
          type: string
          key: status
        - name: Validations
          type: 'map[string]string'
          key: validations
          omitEmpty: true
        - name: MessageUUID
          type: string
          key: msg_uuid
          omitEmpty: true
        - name: Result
          type: string
          key: result
          omitEmpty: true
    rpc_calls:
      - name: "Get"
        endpoint:
          path: "/api_extensions/webgui/get"
          method: GET
        result_type: "WebguiResponse"
      - name: "Set"
        endpoint:
          path: "/api_extensions/webgui/set"
          method: POST
        params:
          - name: "settings"
            key: webgui
            customType: WebguiSettings
            bodyParameter: true
        result_type: "WebguiActionResult"
      - name: "Reconfigure"
        endpoint:
          path: "/api_extensions/webgui/reconfigure"
          method: POST
        result_type: "WebguiActionResult"

  - name: "Ssh"
    filename: ssh
    customTypes:
      SshSettings:
        - name: Enabled
          type: bool
          key: enabled
        - name: Port
          type: int
          key: port
        - name: Interfaces
          type: '[]string'
          key: interfaces
        - name: PasswordAuthentication
          type: bool
          key: password_authentication
        - name: PermitRootLogin
          type: bool
          key: permit_root_login
      SshResponse:
        - name: SSH
          type: SshSettings
          key: ssh
      SshActionResult:
        - name: Status
          type: string
          key: status
        - name: Validations
          type: 'map[string]string'
          key: validations
          omitEmpty: true
        - name: Result
          type: string
          key: result
          omitEmpty: true
    rpc_calls:
      - name: "Get"
        endpoint:
          path: "/api_extensions/ssh/get"
          method: GET
        result_type: "SshResponse"
      - name: "Set"
        endpoint:
          path: "/api_extensions/ssh/set"
          method: POST
        params:
          - name: "settings"
            key: ssh
            customType: SshSettings
            bodyParameter: true
        result_type: "SshActionResult"
      - name: "Reconfigure"
        endpoint:
          path: "/api_extensions/ssh/reconfigure"
          method: POST
        result_type: "SshActionResult"

  - name: "Ntp"
    filename: ntp
    customTypes:
      NtpServer:
        - name: Host
          type: string
          key: host
        - name: NoSelect
          type: bool
          key: noselect
        - name: Prefer
          type: bool
          key: prefer
        - name: IBurst
          type: bool
          key: iburst
        - name: Pool
          type: bool
          key: pool
      NtpSettings:
        - name: Enabled
          type: bool
          key: enabled
        - name: Servers
          type: '[]NtpServer'
          key: servers
        - name: Interfaces
          type: '[]string'
          key: interfaces
        - name: Orphan
          type: int
          key: orphan
        - name: MaxClock
          type: int
          key: max_clock
        - name: ClientMode
          type: bool
          key: client_mode
        - name: KissOfDeath
          type: bool
          key: kiss_of_death
        - name: RateLimiting
          type: bool
          key: rate_limiting
        - name: DenyModifications
          type: bool
          key: deny_modifications
        - name: DisableQueries
          type: bool
          key: disable_queries
        - name: DisableServing
          type: bool
          key: disable_serving
        - name: DenyPeerAssociations
          type: bool
          key: deny_peer_associations
        - name: DenyTrapService
          type: bool
          key: deny_trap_service
      NtpResponse:
        - name: NTP
          type: NtpSettings
          key: ntp
      NtpActionResult:
        - name: Status
          type: string
          key: status
        - name: Validations
          type: 'map[string]string'
          key: validations
          omitEmpty: true
    rpc_calls:
      - name: "Get"
        endpoint:
          path: "/api_extensions/ntp/get"
          method: GET
        result_type: "NtpResponse"
      - name: "Set"
        endpoint:
          path: "/api_extensions/ntp/set"
          method: POST
        params:
          - name: "settings"
            key: ntp
            customType: NtpSettings
            bodyParameter: true
        result_type: "NtpActionResult"
      - name: "Reconfigure"
        endpoint:
          path: "/api_extensions/ntp/reconfigure"
          method: POST
        result_type: "NtpActionResult"

  - name: "CarpHealth"
    filename: carp_health
    customTypes:
      CarpHealthSettings:
        - name: Enabled
          type: api.BoolString
          key: enabled
        - name: Interval
          type: string
          key: interval
        - name: FailureThreshold
          type: string
          key: failure_threshold
        - name: RecoveryThreshold
          type: string
          key: recovery_threshold
      CarpHealthResponse:
        - name: CarpHealth
          type: CarpHealthSettings
          key: carp_health
      CarpHealthActionResult:
        - name: Status
          type: string
          key: status
          omitEmpty: true
        - name: Result
          type: string
          key: result
          omitEmpty: true
        - name: Validations
          type: 'map[string]interface{}'
          key: validations
          omitEmpty: true
      CarpHealthRouteStatus:
        - name: Key
          type: string
          key: key
        - name: CheckUUID
          type: string
          key: check_uuid
        - name: Check
          type: string
          key: check
        - name: Family
          type: string
          key: family
        - name: RouteType
          type: string
          key: route_type
        - name: Destination
          type: string
          key: destination
        - name: Gateway
          type: string
          key: gateway
        - name: DesiredInstalled
          type: bool
          key: desired_installed
        - name: Installed
          type: bool
          key: installed
        - name: Managed
          type: bool
          key: managed
        - name: ControlOK
          type: bool
          key: control_ok
        - name: Retired
          type: bool
          key: retired
        - name: Error
          type: string
          key: error
      CarpHealthCheckStatus:
        - name: UUID
          type: string
          key: uuid
        - name: Name
          type: string
          key: name
        - name: Interface
          type: string
          key: interface
        - name: Device
          type: string
          key: device
        - name: Target
          type: string
          key: target
        - name: Scope
          type: string
          key: scope
        - name: VHID
          type: int
          key: vhid
        - name: VHIDTargets
          type: '[]string'
          key: vhid_targets
        - name: ConfiguredVHIDTargets
          type: '[]string'
          key: configured_vhid_targets
        - name: FailureAdvSkew
          type: int
          key: failure_advskew
        - name: VHIDStates
          type: '[]CarpHealthVHIDStatus'
          key: vhid_states
        - name: FallbackRoutes
          type: '[]CarpHealthRouteStatus'
          key: fallback_routes
        - name: CarpState
          type: string
          key: carp_state
        - name: ConfiguredAdvSkew
          type: '*int'
          key: configured_advskew
        - name: CurrentAdvSkew
          type: '*int'
          key: current_advskew
        - name: ControlOK
          type: bool
          key: control_ok
        - name: Healthy
          type: bool
          key: healthy
        - name: Failures
          type: int
          key: failures
        - name: Successes
          type: int
          key: successes
      CarpHealthGlobalStatus:
        - name: Active
          type: bool
          key: active
        - name: CheckCount
          type: int
          key: check_count
        - name: Ready
          type: bool
          key: ready
        - name: Healthy
          type: bool
          key: healthy
      CarpHealthVHIDStatus:
        - name: Key
          type: string
          key: key
        - name: Interface
          type: string
          key: interface
        - name: Device
          type: string
          key: device
        - name: VHID
          type: int
          key: vhid
        - name: Checks
          type: '[]string'
          key: checks
        - name: Ready
          type: bool
          key: ready
        - name: Healthy
          type: bool
          key: healthy
        - name: DesiredDemoted
          type: bool
          key: desired_demoted
        - name: DesiredAdvSkew
          type: '*int'
          key: desired_advskew
        - name: ConfiguredAdvSkew
          type: '*int'
          key: configured_advskew
        - name: CurrentAdvSkew
          type: '*int'
          key: current_advskew
        - name: CarpState
          type: string
          key: carp_state
        - name: ControlOK
          type: bool
          key: control_ok
        - name: Retired
          type: bool
          key: retired
        - name: Error
          type: string
          key: error
      CarpHealthStatusResponse:
        - name: Status
          type: string
          key: status
        - name: Enabled
          type: bool
          key: enabled
        - name: Ready
          type: bool
          key: ready
        - name: Healthy
          type: bool
          key: healthy
        - name: ProbeHealthy
          type: bool
          key: probe_healthy
        - name: ControlOK
          type: bool
          key: control_ok
        - name: Running
          type: bool
          key: running
        - name: Timestamp
          type: float64
          key: timestamp
        - name: ConfigSignature
          type: string
          key: config_signature
        - name: Global
          type: CarpHealthGlobalStatus
          key: global
        - name: VHIDs
          type: '[]CarpHealthVHIDStatus'
          key: vhids
        - name: Routes
          type: '[]CarpHealthRouteStatus'
          key: routes
        - name: Checks
          type: '[]CarpHealthCheckStatus'
          key: checks
    rpc_calls:
      - name: "Get"
        endpoint:
          path: "/api_extensions/carp_health/get"
          method: GET
        result_type: "CarpHealthResponse"
      - name: "Set"
        endpoint:
          path: "/api_extensions/carp_health/set"
          method: POST
        params:
          - name: "settings"
            key: carp_health
            customType: CarpHealthSettings
            bodyParameter: true
        result_type: "CarpHealthActionResult"
      - name: "Reconfigure"
        endpoint:
          path: "/api_extensions/carp_health/reconfigure"
          method: POST
        result_type: "CarpHealthActionResult"
      - name: "Status"
        endpoint:
          path: "/api_extensions/carp_health/status"
          method: GET
        result_type: "CarpHealthStatusResponse"
