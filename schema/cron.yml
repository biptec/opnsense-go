---
name: cron
resources:
  - name: Job
    filename: job
    monad: job
    endpoints:
      create:
        path: "/cron/settings/addJob"
        method: POST
      read:
        path: "/cron/settings/getJob"
        method: GET
      update:
        path: "/cron/settings/setJob"
        method: POST
      delete:
        path: "/cron/settings/delJob"
        method: POST
      reconfigure:
        path: "/cron/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Minutes
        type: string
        key: minutes
      - name: Hours
        type: string
        key: hours
      - name: Days
        type: string
        key: days
      - name: Months
        type: string
        key: months
      - name: Weekdays
        type: string
        key: weekdays
      - name: Who
        type: string
        key: who
      - name: Command
        type: SelectedMap
        key: command
      - name: Parameters
        type: string
        key: parameters
      - name: Description
        type: string
        key: description
