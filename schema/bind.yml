---
# see https://docs.opnsense.org/development/api/plugins/bind.html
name: bind
resources:
  - name: Acl
    filename: acl
    monad: acl
    endpoints:
      create:
        path: "/bind/acl/add_acl"
        method: POST
      read:
        path: "/bind/acl/get_acl"
        method: GET
      update:
        path: "/bind/acl/set_acl"
        method: POST
      delete:
        path: "/bind/acl/del_acl"
        method: POST
      reconfigure:
        path: "/bind/service/reconfigure"
        method: POST
    attrs:
      - name: Name
        type: string
        key: name
      - name: Enabled
        type: string
        key: enabled
      - name: Networks
        type: SelectedMapList
        key: networks

  - name: PrimaryDomain
    filename: primary_domain
    monad: domain
    endpoints:
      create:
        path: "/bind/domain/add_primary_domain"
        method: POST
      read:
        path: "/bind/domain/get_domain"
        method: GET
      update:
        path: "/bind/domain/set_domain"
        method: POST
      delete:
        path: "/bind/domain/del_domain"
        method: POST
      reconfigure:
        path: "/bind/service/reconfigure"
        method: POST
    attrs:
      - name: DomainName
        type: string
        key: domainname
      - name: Enabled
        type: string
        key: enabled
      - name: AllowTransfer
        type: SelectedMapList
        key: allowtransfer
      - name: AllowQuery
        type: SelectedMapList
        key: allowquery
      - name: TimeToLive
        type: string
        key: ttl
      - name: Refresh
        type: string
        key: refresh
      - name: Retry
        type: string
        key: retry
      - name: Expire
        type: string
        key: expire
      - name: Negative
        type: string
        key: negative
      - name: MailAdmin
        type: string
        key: mailadmin
      - name: DnsServer
        type: string
        key: dnsserver

  - name: Record
    filename: record
    monad: record
    endpoints:
      create:
        path: "/bind/record/add_record"
        method: POST
      read:
        path: "/bind/record/get_record"
        method: GET
      update:
        path: "/bind/record/set_record"
        method: POST
      delete:
        path: "/bind/record/del_record"
        method: POST
      reconfigure:
        path: "/bind/service/reconfigure"
        method: POST
    attrs:
      - name: Domain
        type: SelectedMap
        key: domain
      - name: Enabled
        type: string
        key: enabled
      - name: Name
        type: string
        key: name
      - name: Type
        type: SelectedMap
        key: type
      - name: Value
        type: string
        key: value
