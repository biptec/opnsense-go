---
name: ipsec
resources:
  - name: IPsecPSK
    filename: ipsec_psk
    monad: preSharedKey
    endpoints:
      create:
        path: "/ipsec/pre_shared_keys/add_item"
        method: POST
      read:
        path: "/ipsec/pre_shared_keys/get_item"
        method: GET
      update:
        path: "/ipsec/pre_shared_keys/set_item"
        method: POST
      delete:
        path: "/ipsec/pre_shared_keys/del_item"
        method: POST
      reconfigure:
        path: "/ipsec/service/reconfigure"
        method: POST
    attrs:
      - name: IdentityLocal
        type: string
        key: ident
      - name: IdentityRemote
        type: string
        key: remote_ident
      - name: PreSharedKey
        type: string
        key: Key
      - name: Type
        type: SelectedMap
        key: keyType
      - name: Description
        type: string
        key: description

  - name: IPsecConnection
    filename: ipsec_connection
    monad: connection
    endpoints:
      create:
        path: "/ipsec/connections/add_connection"
        method: POST
      read:
        path: "/ipsec/connections/get_connection"
        method: GET
      update:
        path: "/ipsec/connections/set_connection"
        method: POST
      delete:
        path: "/ipsec/connections/del_connection"
        method: POST
      reconfigure:
        path: "/ipsec/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Proposals
        type: SelectedMapList
        key: proposals
      - name: Unique
        type: SelectedMap
        key: unique
      - name: Aggressive
        type: string
        key: aggressive
      - name: Version
        type: SelectedMap
        key: version
      - name: Mobike
        type: string
        key: mobike
      - name: LocalAddresses
        type: SelectedMapList
        key: local_addrs
      - name: RemoteAddresses
        type: SelectedMapList
        key: remote_addrs
      - name: LocalPort
        type: SelectedMap
        key: local_port
      - name: RemotePort
        type: SelectedMap
        key: remote_port
      - name:  UDPEncapsulation
        type: string
        key: encap
      - name: ReauthenticationTime
        type: string
        key: reauth_time
      - name: RekeyTime
        type: string
        key: rekey_time
      - name: IKELifetime
        type: string
        key: over_time
      - name: DPDDelay
        type: string
        key: dpd_delay
      - name: DPDTimeout
        type: string
        key: dpd_timeout
      - name: IPPools
        type: SelectedMapList
        key: pools
      - name: SendCertificateRequest
        type: string
        key: send_certreq
      - name: SendCertificate
        type: SelectedMap
        key: send_cert
      - name: KeyingTries
        type: string
        key: keyingtries
      - name: Description
        type: string
        key: description

  - name: IPsecAuthLocal
    filename: ipsec_auth_local
    monad: local
    endpoints:
      create:
        path: "/ipsec/connections/add_local"
        method: POST
      read:
        path: "/ipsec/connections/get_local"
        method: GET
      update:
        path: "/ipsec/connections/set_local"
        method: POST
      delete:
        path: "/ipsec/connections/del_local"
        method: POST
      reconfigure:
        path: "/ipsec/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Connection
        type: SelectedMap
        key: connection
      - name: Round
        type: string
        key: round
      - name: Authentication
        type: SelectedMap
        key: auth
      - name: Id
        type: string
        key: id
      - name: EAPId
        type: string
        key: eap_id
      - name: Certificates
        type: SelectedMapList
        key: certs
      - name: PublicKeys
        type: SelectedMapList
        key: public_keys
      - name: Description
        type: string
        key: description


  - name: IPsecAuthRemote
    filename: ipsec_auth_remote
    monad: remote
    endpoints:
      create:
        path: "/ipsec/connections/add_remote"
        method: POST
      read:
        path: "/ipsec/connections/get_remote"
        method: GET
      update:
        path: "/ipsec/connections/set_remote"
        method: POST
      delete:
        path: "/ipsec/connections/del_remote"
        method: POST
      reconfigure:
        path: "/ipsec/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Connection
        type: SelectedMap
        key: connection
      - name: Round
        type: string
        key: round
      - name: Authentication
        type: SelectedMap
        key: auth
      - name: Id
        type: string
        key: id
      - name: EAPId
        type: string
        key: eap_id
      - name: Certificates
        type: SelectedMapList
        key: certs
      - name: PublicKeys
        type: SelectedMapList
        key: public_keys
      - name: Description
        type: string
        key: description

  - name: IPsecChild
    filename: ipsec_child
    monad: child
    endpoints:
      create:
        path: "/ipsec/connections/add_child"
        method: POST
      read:
        path: "/ipsec/connections/get_child"
        method: GET
      update:
        path: "/ipsec/connections/set_child"
        method: POST
      delete:
        path: "/ipsec/connections/del_child"
        method: POST
      reconfigure:
        path: "/ipsec/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Connection
        type: SelectedMap
        key: connection
      - name: Proposals
        type: SelectedMapList
        key: esp_proposals
      - name: SHA256_96
        type: string
        key: sha256_96
      - name: StartAction
        type: SelectedMap
        key: start_action
      - name: CloseAction
        type: SelectedMap
        key: close_action
      - name: DPDAction
        type: SelectedMap
        key: dpd_action
      - name: Mode
        type: SelectedMap
        key: mode
      - name: InstallPolicies
        type: string
        key: policies
      - name: LocalNetworks
        type: SelectedMapList
        key: local_ts
      - name: RemoteNetworks
        type: SelectedMapList
        key: remote_ts
      - name: RequestID
        type: string
        key: reqid
      - name: RekeyTime
        type: string
        key: rekey_time
      - name: Description
        type: string
        key: description

  - name: IPsecVTI
    filename: ipsec_vti
    monad: vti
    endpoints:
      create:
        path: "/ipsec/vti/add"
        method: POST
      read:
        path: "/ipsec/vti/get"
        method: GET
      update:
        path: "/ipsec/vti/set"
        method: POST
      delete:
        path: "/ipsec/vti/del"
        method: POST
      reconfigure:
        path: "/ipsec/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: RequestID
        type: string
        key: reqid
      - name: LocalIP
        type: string
        key: local
      - name: RemoteIP
        type: string
        key: remote
      - name: TunnelLocalIP
        type: string
        key: tunnel_local
      - name: TunnelRemoteIP
        type: string
        key: tunnel_remote
      - name: TunnelLocalIP2
        type: string
        key: tunnel_local2
      - name: TunnelRemoteIP2
        type: string
        key: tunnel_remote2
      - name: Description
        type: string
        key: description
