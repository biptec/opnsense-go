    filename: settings
    customTypes:
      InterfaceSettings:
        - name: DisableChecksumOffloading
          type: string
          key: disablechecksumoffloading
        - name: DisableSegmentationOffloading
          type: string
          key: disablesegmentationoffloading
        - name: DisableLargeReceiveOffloading
          type: string
