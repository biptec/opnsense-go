          type: string
          key: dhcp6_duid
        - name: DHCP6RATimeout
          type: string
          key: dhcp6_ratimeout
      SettingsGetResult:
        - name: Settings
          type: InterfaceSettings
          key: settings
        - name: DUIDs
          type: map[string]string
          key: duids
    rpc_calls:
      - name: "Get"
        endpoint:
          path: "/interfaces/settings/get"
          method: GET
        result_type: "SettingsGetResult"
      - name: "Set"
        endpoint:
          path: "/interfaces/settings/set"
          method: POST
        params:
          - name: settings
            optional: false
            bodyParameter: true
            customType: InterfaceSettings
        result_type: "api.ActionResult"
      - name: "Reconfigure"
        endpoint:
          path: "/interfaces/settings/reconfigure"
          method: POST
        result_type: "api.ReconfigureStatusResult"

