---
name: core
rpc:
  - name: "System"
    filename: system
    customTypes: 
      SystemStatus:
        - name: CrashReporter
          type: Status
          key: CrashReporter   
        - name: Firewall
          type: Status
          key: Firewall   
        - name: System
          type: Status
          key: System   
      Status:
        - name: StatusCode
          type: int
          key: statusCode
        - name: Message
          type: string
          key: message
        - name: LogLocation
          type: string
          key: logLocation
        - name: Timestamp
          type: string
          key: timestamp
        - name: Status
          type: string
          key: status
    rpc_calls:
      - name: "Halt"
        endpoint:
          path: "/core/system/halt"
          method: POST
        result_type: "api.ActionResult"
      - name: "Reboot"
        endpoint:
          path: "/core/system/reboot"
          method: POST
        result_type: "api.ActionResult"
      - name: "Status"
        endpoint:
          path: "/core/system/status"
          method: GET
        result_type: "SystemStatus"
      - name: "DismissStatus"
        endpoint:
          path: "/core/system/dismiss_status"
          method: POST
        params:
          - name: "subject"
            optional: false
            bodyParameter: true
        result_type: "api.ActionResult"  
  - name: "Service"
    filename: service
    customTypes:
      ServiceItem:
        - name: ID
          type: string
          key: id
        - name: Locked
          type: int
          key: locked
        - name: Running
          type: int
          key: running
        - name: Description
          type: string
          key: description
        - name: Name
          type: string
          key: name
      SearchServicesResponse:
        - name: Total
          type: int
          key: total
        - name: RowCount
          type: int
          key: rowCount
        - name: Current
          type: int
          key: current
        - name: Rows
          type: '[]ServiceItem'
          key: rows
      ServiceActionResult:
        - name: Result
          type: string
          key: result
    rpc_calls:
      - name: "Search"
        endpoint:
          path: "/core/service/search"
          method: POST
        result_type: "SearchServicesResponse"
      - name: "Start"
        endpoint:
          path: "/core/service/start"
          method: POST
        params:
          - name: "id"
            optional: false
        result_type: "ServiceActionResult"
      - name: "Stop"
        endpoint:
          path: "/core/service/stop"
          method: POST
        params:
          - name: "id" # Path parameter
            optional: false
        result_type: "ServiceActionResult"
      - name: "Restart"
        endpoint:
          path: "/core/service/restart"
          method: POST
        params:
          - name: "id"
            optional: false
        result_type: "ServiceActionResult"

  - name: "Firmware"
    filename: firmware
    customTypes:
      FirmwarePackage:
        - name: Name
          type: string
          key: name
        - name: Version
          type: string
          key: version
        - name: Comment
          type: string
          key: comment
        - name: FlatSize
          type: string
          key: flatsize
        - name: Locked
          type: string
          key: locked
        - name: Automatic
          type: string
          key: automatic
        - name: License
          type: string
          key: license
        - name: Repository
          type: string
          key: repository
        - name: Origin
          type: string
          key: origin
        - name: Provided
          type: string
          key: provided
        - name: Installed
          type: string
          key: installed
        - name: Path
          type: string
          key: path
        - name: Configured
          type: string
          key: configured
        - name: Tier
          type: string
          key: tier
      FirmwareInfoResponse:
        - name: ProductID
          type: string
          key: product_id
        - name: ProductVersion
          type: string
          key: product_version
        - name: Packages
          type: '[]FirmwarePackage'
          key: package
        - name: Plugins
          type: '[]FirmwarePackage'
          key: plugin
      FirmwareActionResult:
        - name: Status
          type: string
          key: status
        - name: MessageUUID
          type: string
          key: msg_uuid
      FirmwareRunningResponse:
        - name: Status
          type: string
          key: status
      FirmwareUpgradeStatusResponse:
        - name: Status
          type: string
          key: status
        - name: Log
          type: string
          key: log
    rpc_calls:
      - name: "Info"
        endpoint:
          path: "/core/firmware/info"
          method: GET
        result_type: "FirmwareInfoResponse"
      - name: "Install"
        endpoint:
          path: "/core/firmware/install"
          method: POST
        params:
          - name: "packageName"
            optional: false
        result_type: "FirmwareActionResult"
      - name: "Remove"
        endpoint:
          path: "/core/firmware/remove"
          method: POST
        params:
          - name: "packageName"
            optional: false
        result_type: "FirmwareActionResult"
      - name: "Lock"
        endpoint:
          path: "/core/firmware/lock"
          method: POST
        params:
          - name: "packageName"
            optional: false
        result_type: "FirmwareActionResult"
      - name: "Unlock"
        endpoint:
          path: "/core/firmware/unlock"
          method: POST
        params:
          - name: "packageName"
            optional: false
        result_type: "FirmwareActionResult"
      - name: "Running"
        endpoint:
          path: "/core/firmware/running"
          method: GET
        result_type: "FirmwareRunningResponse"
      - name: "UpgradeStatus"
        endpoint:
          path: "/core/firmware/upgradestatus"
          method: GET
        result_type: "FirmwareUpgradeStatusResponse"
  - name: "Hasync"
    filename: hasync
    customTypes:
      HasyncResponse:
        - name: Hasync
          type: HasyncSettings
          key: hasync
      HasyncSettings:
        - name: DisablePreempt
          type: string
          key: disablepreempt
        - name: DisconnectPPPs
          type: string
          key: disconnectppps
        - name: PfsyncInterface
          type: SelectedMap
          key: pfsyncinterface
        - name: PfsyncPeerIP
          type: string
          key: pfsyncpeerip
        - name: PfsyncVersion
          type: SelectedMap
          key: pfsyncversion
        - name: PfsyncDefer
          type: string
          key: pfsyncdefer
        - name: SynchronizeToIP
          type: string
          key: synchronizetoip
        - name: VerifyPeer
          type: string
          key: verifypeer
        - name: Username
          type: string
          key: username
        - name: Password
          type: string
          key: password
        - name: SyncItems
          type: SelectedMapList
          key: syncitems
    rpc_calls:
      - name: Get
        endpoint:
          path: "/core/hasync/get"
          method: GET
        result_type: HasyncResponse
      - name: Set
        endpoint:
          path: "/core/hasync/set"
          method: POST
        params:
          - name: hasync
            optional: false
            bodyParameter: true
            customType: HasyncSettings
        result_type: api.ActionResult
      - name: Reconfigure
        endpoint:
          path: "/core/hasync/reconfigure"
          method: POST
        result_type: api.ReconfigureStatusResult

resources:
  - name: Tunable
    filename: tunable
    monad: sysctl
    endpoints:
      create: {path: "/core/tunables/add_item", method: POST}
      read: {path: "/core/tunables/get_item", method: GET}
      update: {path: "/core/tunables/set_item", method: POST}
      delete: {path: "/core/tunables/del_item", method: POST}
      search: {path: "/core/tunables/search_item", method: POST}
      reconfigure: {path: "/core/tunables/reconfigure", method: POST}
    attrs:
      - {name: Tunable, type: string, key: tunable}
      - {name: Value, type: string, key: value}
      - {name: Description, type: string, key: descr}
