---
name: core
rpc:
  - name: "System"
    filename: system
    customTypes: 
      SystemStatus:
        - name: CrashReporter
          type: Status
          key: CrashReporter   
        - name: Firewall
          type: Status
          key: Firewall   
        - name: System
          type: Status
          key: System   
      Status:
        - name: StatusCode
          type: int
          key: statusCode
        - name: Message
          type: string
          key: message
        - name: LogLocation
          type: string
          key: logLocation
        - name: Timestamp
          type: string
          key: timestamp
        - name: Status
          type: string
          key: status
    rpc_calls:
      - name: "Halt"
        endpoint:
          path: "/core/system/halt"
          method: POST
        result_type: "api.ActionResult"
      - name: "Reboot"
        endpoint:
          path: "/core/system/reboot"
          method: POST
        result_type: "api.ActionResult"
      - name: "Status"
        endpoint:
          path: "/core/system/status"
          method: GET
        result_type: "SystemStatus"
      - name: "DismissStatus"
        endpoint:
          path: "/core/system/dismiss_status"
          method: POST
        params:
          - name: "subject"
            optional: false
            bodyParameter: true
        result_type: "api.ActionResult"  
  - name: "Service"
    filename: service
    customTypes:
      ServiceItem:
        - name: ID
          type: string
          key: id
        - name: Locked
          type: int
          key: locked
        - name: Running
          type: int
          key: running
        - name: Description
          type: string
          key: description
        - name: Name
          type: string
          key: name
      SearchServicesResponse:
        - name: Total
          type: int
          key: total
        - name: RowCount
          type: int
          key: rowCount
        - name: Current
          type: int
          key: current
        - name: Rows
          type: '[]ServiceItem'
          key: rows
      ServiceActionResult:
        - name: Result
          type: string
          key: result
    rpc_calls:
      - name: "Search"
        endpoint:
          path: "/core/service/search"
          method: POST
        result_type: "SearchServicesResponse"
      - name: "Start"
        endpoint:
          path: "/core/service/start"
          method: POST
        params:
          - name: "id"
            optional: false
        result_type: "ServiceActionResult"
      - name: "Stop"
        endpoint:
          path: "/core/service/stop"
          method: POST
        params:
          - name: "id" # Path parameter
            optional: false
        result_type: "ServiceActionResult"
      - name: "Restart"
        endpoint:
          path: "/core/service/restart"
          method: POST
        params:
          - name: "id"
            optional: false
        result_type: "ServiceActionResult"
