---
name: quagga
resources:

  # quagga resources

  - name: BGPNeighbor
    filename: bgp_neighbor
    monad: neighbor
    endpoints:
      create:
        path: "/quagga/bgp/addNeighbor"
        method: POST
      read:
        path: "/quagga/bgp/getNeighbor"
        method: GET
      update:
        path: "/quagga/bgp/setNeighbor"
        method: POST
      delete:
        path: "/quagga/bgp/delNeighbor"
        method: POST
      reconfigure:
        path: "/quagga/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Description
        type: string
        key: description
      - name: PeerIP
        type: string
        key: address
      - name: RemoteAS
        type: string
        key: remoteas
      - name: Password
        type: string
        key: password
      - name: Weight
        type: string
        key: weight
      - name: LocalIP
        type: string
        key: localip
      - name: UpdateSource
        type: SelectedMap
        key: updatesource
      - name: LinkLocalInterface
        type: SelectedMap
        key: linklocalinterface
      - name: NextHopSelf
        type: string
        key: nexthopself
      - name: NextHopSelfAll
        type: string
        key: nexthopselfall
      - name: MultiHop
        type: string
        key: multihop
      - name: MultiProtocol
        type: string
        key: multiprotocol
      - name: RRClient
        type: string
        key: rrclient
      - name: BFD
        type: string
        key: bfd
      - name: KeepAlive
        type: string
        key: keepalive
      - name: HoldDown
        type: string
        key: holddown
      - name: ConnectTimer
        type: string
        key: connecttimer
      - name: DefaultRoute
        type: string
        key: defaultoriginate
      - name: ASOverride
        type: string
        key: asoverride
      - name: DisableConnectedCheck
        type: string
        key: disable_connected_check
      - name: AttributeUnchanged
        type: SelectedMap
        key: attributeunchanged
      - name: PrefixListIn
        type: SelectedMap
        key: linkedPrefixlistIn
      - name: PrefixListOut
        type: SelectedMap
        key: linkedPrefixlistOut
      - name: RouteMapIn
        type: SelectedMap
        key: linkedRoutemapIn
      - name: RouteMapOut
        type: SelectedMap
        key: linkedRoutemapOut

  - name: BGPASPath
    filename: bgp_aspath
    monad: aspath
    endpoints:
      create:
        path: "/quagga/bgp/addAspath"
        method: POST
      read:
        path: "/quagga/bgp/getAspath"
        method: GET
      update:
        path: "/quagga/bgp/setAspath"
        method: POST
      delete:
        path: "/quagga/bgp/delAspath"
        method: POST
      reconfigure:
        path: "/quagga/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Description
        type: string
        key: description
      - name: Number
        type: string
        key: number
      - name: Action
        type: SelectedMap
        key: action
      - name: AS
        type: string
        key: as

  - name: BGPPrefixList
    filename: bgp_prefixlist
    monad: prefixlist
    endpoints:
      create:
        path: "/quagga/bgp/addPrefixlist"
        method: POST
      read:
        path: "/quagga/bgp/getPrefixlist"
        method: GET
      update:
        path: "/quagga/bgp/setPrefixlist"
        method: POST
      delete:
        path: "/quagga/bgp/delPrefixlist"
        method: POST
      reconfigure:
        path: "/quagga/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Description
        type: string
        key: description
      - name: Name
        type: string
        key: name
      - name: IPVersion
        type: SelectedMap
        key: version
      - name: SequenceNumber
        type: string
        key: seqnumber
      - name: Action
        type: SelectedMap
        key: action
      - name: Network
        type: string
        key: network

  - name: BGPCommunityList
    filename: bgp_communitylist
    monad: communitylist
    endpoints:
      create:
        path: "/quagga/bgp/addCommunitylist"
        method: POST
      read:
        path: "/quagga/bgp/getCommunitylist"
        method: GET
      update:
        path: "/quagga/bgp/setCommunitylist"
        method: POST
      delete:
        path: "/quagga/bgp/delCommunitylist"
        method: POST
      reconfigure:
        path: "/quagga/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Description
        type: string
        key: description
      - name: Number
        type: string
        key: number
      - name: SequenceNumber
        type: string
        key: seqnumber
      - name: Action
        type: SelectedMap
        key: action
      - name: Community
        type: string
        key: community

  - name: BGPRouteMap
    filename: bgp_routemap
    monad: routemap
    endpoints:
      create:
        path: "/quagga/bgp/addRoutemap"
        method: POST
      read:
        path: "/quagga/bgp/getRoutemap"
        method: GET
      update:
        path: "/quagga/bgp/setRoutemap"
        method: POST
      delete:
        path: "/quagga/bgp/delRoutemap"
        method: POST
      reconfigure:
        path: "/quagga/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Description
        type: string
        key: description
      - name: Name
        type: string
        key: name
      - name: Action
        type: SelectedMap
        key: action
      - name: RouteMapID
        type: string
        key: id
      - name: ASPathList
        type: SelectedMapList
        key: match
      - name: PrefixList
        type: SelectedMapList
        key: match2
      - name: CommunityList
        type: SelectedMapList
        key: match3
      - name: Set
        type: string
        key: set
