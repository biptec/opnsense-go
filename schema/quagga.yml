---
name: quagga
resources:

  # quagga resources

  - name: BGPNeighbor
    filename: bgp_neighbor
    monad: neighbor
    endpoints:
      create:
        path: "/quagga/bgp/addNeighbor"
        method: POST
      read:
        path: "/quagga/bgp/getNeighbor"
        method: GET
      update:
        path: "/quagga/bgp/setNeighbor"
        method: POST
      delete:
        path: "/quagga/bgp/delNeighbor"
        method: POST
      reconfigure:
        path: "/quagga/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Description
        type: string
        key: description
      - name: PeerIP
        type: string
        key: address
      - name: RemoteAS
        type: string
        key: remoteas
      - name: Password
        type: string
        key: password
      - name: Weight
        type: string
        key: weight
      - name: LocalIP
        type: string
        key: localip
      - name: UpdateSource
        type: SelectedMap
        key: updatesource
      - name: LinkLocalInterface
        type: SelectedMap
        key: linklocalinterface
      - name: NextHopSelf
        type: string
        key: nexthopself
      - name: NextHopSelfAll
        type: string
        key: nexthopselfall
      - name: MultiHop
        type: string
        key: multihop
      - name: MultiProtocol
        type: string
        key: multiprotocol
      - name: RRClient
        type: string
        key: rrclient
      - name: BFD
        type: string
        key: bfd
      - name: KeepAlive
        type: string
        key: keepalive
      - name: HoldDown
        type: string
        key: holddown
      - name: ConnectTimer
        type: string
        key: connecttimer
      - name: DefaultRoute
        type: string
        key: defaultoriginate
      - name: ASOverride
        type: string
        key: asoverride
      - name: DisableConnectedCheck
        type: string
        key: disable_connected_check
      - name: AttributeUnchanged
        type: SelectedMap
        key: attributeunchanged
      - name: PrefixListIn
        type: SelectedMap
        key: linkedPrefixlistIn
      - name: PrefixListOut
        type: SelectedMap
        key: linkedPrefixlistOut
      - name: RouteMapIn
        type: SelectedMap
        key: linkedRoutemapIn
      - name: RouteMapOut
        type: SelectedMap
        key: linkedRoutemapOut

  - name: BGPASPath
    filename: bgp_aspath
    monad: aspath
    endpoints:
      create:
        path: "/quagga/bgp/addAspath"
        method: POST
      read:
        path: "/quagga/bgp/getAspath"
        method: GET
      update:
        path: "/quagga/bgp/setAspath"
        method: POST
      delete:
        path: "/quagga/bgp/delAspath"
        method: POST
      reconfigure:
        path: "/quagga/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Description
        type: string
        key: description
      - name: Number
        type: string
        key: number
      - name: Action
        type: SelectedMap
        key: action
      - name: AS
        type: string
        key: as

  - name: BGPPrefixList
    filename: bgp_prefixlist
    monad: prefixlist
    endpoints:
      create:
        path: "/quagga/bgp/addPrefixlist"
        method: POST
      read:
        path: "/quagga/bgp/getPrefixlist"
        method: GET
      update:
        path: "/quagga/bgp/setPrefixlist"
        method: POST
      delete:
        path: "/quagga/bgp/delPrefixlist"
        method: POST
      reconfigure:
        path: "/quagga/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Description
        type: string
        key: description
      - name: Name
        type: string
        key: name
      - name: IPVersion
        type: SelectedMap
        key: version
      - name: SequenceNumber
        type: string
        key: seqnumber
      - name: Action
        type: SelectedMap
        key: action
      - name: Network
        type: string
        key: network

  - name: BGPCommunityList
    filename: bgp_communitylist
    monad: communitylist
    endpoints:
      create:
        path: "/quagga/bgp/addCommunitylist"
        method: POST
      read:
        path: "/quagga/bgp/getCommunitylist"
        method: GET
      update:
        path: "/quagga/bgp/setCommunitylist"
        method: POST
      delete:
        path: "/quagga/bgp/delCommunitylist"
        method: POST
      reconfigure:
        path: "/quagga/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Description
        type: string
        key: description
      - name: Number
        type: string
        key: number
      - name: SequenceNumber
        type: string
        key: seqnumber
      - name: Action
        type: SelectedMap
        key: action
      - name: Community
        type: string
        key: community

  - name: BGPRouteMap
    filename: bgp_routemap
    monad: routemap
    endpoints:
      create:
        path: "/quagga/bgp/addRoutemap"
        method: POST
      read:
        path: "/quagga/bgp/getRoutemap"
        method: GET
      update:
        path: "/quagga/bgp/setRoutemap"
        method: POST
      delete:
        path: "/quagga/bgp/delRoutemap"
        method: POST
      reconfigure:
        path: "/quagga/service/reconfigure"
        method: POST
    attrs:
      - name: Enabled
        type: string
        key: enabled
      - name: Description
        type: string
        key: description
      - name: Name
        type: string
        key: name
      - name: Action
        type: SelectedMap
        key: action
      - name: RouteMapID
        type: string
        key: id
      - name: ASPathList
        type: SelectedMapList
        key: match
      - name: PrefixList
        type: SelectedMapList
        key: match2
      - name: CommunityList
        type: SelectedMapList
        key: match3
      - name: Set
        type: string
        key: set

  - name: OSPFPrefixList
    filename: ospf_prefixlist
    monad: prefixlist
    endpoints:
      create: {path: "/quagga/ospfsettings/addPrefixlist", method: POST}
      read: {path: "/quagga/ospfsettings/getPrefixlist", method: GET}
      update: {path: "/quagga/ospfsettings/setPrefixlist", method: POST}
      delete: {path: "/quagga/ospfsettings/delPrefixlist", method: POST}
      search: {path: "/quagga/ospfsettings/searchPrefixlist", method: POST}
      reconfigure: {path: "/quagga/service/reconfigure", method: POST}
    attrs:
      - {name: Enabled, type: string, key: enabled}
      - {name: Name, type: string, key: name}
      - {name: SequenceNumber, type: string, key: seqnumber}
      - {name: Action, type: SelectedMap, key: action}
      - {name: Network, type: string, key: network}

  - name: OSPFRouteMap
    filename: ospf_routemap
    monad: routemap
    endpoints:
      create: {path: "/quagga/ospfsettings/addRoutemap", method: POST}
      read: {path: "/quagga/ospfsettings/getRoutemap", method: GET}
      update: {path: "/quagga/ospfsettings/setRoutemap", method: POST}
      delete: {path: "/quagga/ospfsettings/delRoutemap", method: POST}
      search: {path: "/quagga/ospfsettings/searchRoutemap", method: POST}
      reconfigure: {path: "/quagga/service/reconfigure", method: POST}
    attrs:
      - {name: Enabled, type: string, key: enabled}
      - {name: Name, type: string, key: name}
      - {name: Action, type: SelectedMap, key: action}
      - {name: RouteMapID, type: string, key: id}
      - {name: PrefixList, type: SelectedMapList, key: match2}
      - {name: Set, type: string, key: set}

  - name: OSPFRedistribution
    filename: ospf_redistribution
    monad: redistribution
    endpoints:
      create: {path: "/quagga/ospfsettings/addRedistribution", method: POST}
      read: {path: "/quagga/ospfsettings/getRedistribution", method: GET}
      update: {path: "/quagga/ospfsettings/setRedistribution", method: POST}
      delete: {path: "/quagga/ospfsettings/delRedistribution", method: POST}
      search: {path: "/quagga/ospfsettings/searchRedistribution", method: POST}
      reconfigure: {path: "/quagga/service/reconfigure", method: POST}
    attrs:
      - {name: Enabled, type: string, key: enabled}
      - {name: Description, type: string, key: description}
      - {name: Redistribute, type: SelectedMap, key: redistribute}
      - {name: RouteMap, type: SelectedMap, key: linkedRoutemap}

  - name: OSPFNetwork
    filename: ospf_network
    monad: network
    endpoints:
      create: {path: "/quagga/ospfsettings/addNetwork", method: POST}
      read: {path: "/quagga/ospfsettings/getNetwork", method: GET}
      update: {path: "/quagga/ospfsettings/setNetwork", method: POST}
      delete: {path: "/quagga/ospfsettings/delNetwork", method: POST}
      search: {path: "/quagga/ospfsettings/searchNetwork", method: POST}
      reconfigure: {path: "/quagga/service/reconfigure", method: POST}
    attrs:
      - {name: Enabled, type: string, key: enabled}
      - {name: IPAddress, type: string, key: ipaddr}
      - {name: Area, type: string, key: area}
      - {name: Netmask, type: string, key: netmask}
      - {name: AreaRange, type: string, key: arearange}
      - {name: PrefixListIn, type: SelectedMap, key: linkedPrefixlistIn}
      - {name: PrefixListOut, type: SelectedMap, key: linkedPrefixlistOut}

  - name: OSPFInterface
    filename: ospf_interface
    monad: interface
    endpoints:
      create: {path: "/quagga/ospfsettings/addInterface", method: POST}
      read: {path: "/quagga/ospfsettings/getInterface", method: GET}
      update: {path: "/quagga/ospfsettings/setInterface", method: POST}
      delete: {path: "/quagga/ospfsettings/delInterface", method: POST}
      search: {path: "/quagga/ospfsettings/searchInterface", method: POST}
      reconfigure: {path: "/quagga/service/reconfigure", method: POST}
    attrs:
      - {name: Enabled, type: string, key: enabled}
      - {name: InterfaceName, type: SelectedMap, key: interfacename}
      - {name: AuthType, type: SelectedMap, key: authtype}
      - {name: AuthKey, type: string, key: authkey}
      - {name: AuthKeyID, type: string, key: authkey_id}
      - {name: Area, type: string, key: area}
      - {name: Cost, type: string, key: cost}
      - {name: CostDemoted, type: string, key: cost_demoted}
      - {name: CarpDependOn, type: SelectedMap, key: carp_depend_on}
      - {name: HelloInterval, type: string, key: hellointerval}
      - {name: DeadInterval, type: string, key: deadinterval}
      - {name: RetransmitInterval, type: string, key: retransmitinterval}
      - {name: TransmitDelay, type: string, key: transmitdelay}
      - {name: Priority, type: string, key: priority}
      - {name: BFD, type: string, key: bfd}
      - {name: NetworkType, type: SelectedMap, key: networktype}
      - {name: P2MPOptions, type: SelectedMap, key: p2mpoptions}

  - name: OSPF6PrefixList
    filename: ospf6_prefixlist
    monad: prefixlist
    endpoints:
      create: {path: "/quagga/ospf6settings/addPrefixlist", method: POST}
      read: {path: "/quagga/ospf6settings/getPrefixlist", method: GET}
      update: {path: "/quagga/ospf6settings/setPrefixlist", method: POST}
      delete: {path: "/quagga/ospf6settings/delPrefixlist", method: POST}
      search: {path: "/quagga/ospf6settings/searchPrefixlist", method: POST}
      reconfigure: {path: "/quagga/service/reconfigure", method: POST}
    attrs:
      - {name: Enabled, type: string, key: enabled}
      - {name: Name, type: string, key: name}
      - {name: SequenceNumber, type: string, key: seqnumber}
      - {name: Action, type: SelectedMap, key: action}
      - {name: Network, type: string, key: network}

  - name: OSPF6RouteMap
    filename: ospf6_routemap
    monad: routemap
    endpoints:
      create: {path: "/quagga/ospf6settings/addRoutemap", method: POST}
      read: {path: "/quagga/ospf6settings/getRoutemap", method: GET}
      update: {path: "/quagga/ospf6settings/setRoutemap", method: POST}
      delete: {path: "/quagga/ospf6settings/delRoutemap", method: POST}
      search: {path: "/quagga/ospf6settings/searchRoutemap", method: POST}
      reconfigure: {path: "/quagga/service/reconfigure", method: POST}
    attrs:
      - {name: Enabled, type: string, key: enabled}
      - {name: Name, type: string, key: name}
      - {name: Action, type: SelectedMap, key: action}
      - {name: RouteMapID, type: string, key: id}
      - {name: PrefixList, type: SelectedMapList, key: match2}
      - {name: Set, type: string, key: set}

  - name: OSPF6Redistribution
    filename: ospf6_redistribution
    monad: redistribution
    endpoints:
      create: {path: "/quagga/ospf6settings/addRedistribution", method: POST}
      read: {path: "/quagga/ospf6settings/getRedistribution", method: GET}
      update: {path: "/quagga/ospf6settings/setRedistribution", method: POST}
      delete: {path: "/quagga/ospf6settings/delRedistribution", method: POST}
      search: {path: "/quagga/ospf6settings/searchRedistribution", method: POST}
      reconfigure: {path: "/quagga/service/reconfigure", method: POST}
    attrs:
      - {name: Enabled, type: string, key: enabled}
      - {name: Description, type: string, key: description}
      - {name: Redistribute, type: SelectedMap, key: redistribute}
      - {name: RouteMap, type: SelectedMap, key: linkedRoutemap}

  - name: OSPF6Network
    filename: ospf6_network
    monad: network
    endpoints:
      create: {path: "/quagga/ospf6settings/addNetwork", method: POST}
      read: {path: "/quagga/ospf6settings/getNetwork", method: GET}
      update: {path: "/quagga/ospf6settings/setNetwork", method: POST}
      delete: {path: "/quagga/ospf6settings/delNetwork", method: POST}
      search: {path: "/quagga/ospf6settings/searchNetwork", method: POST}
      reconfigure: {path: "/quagga/service/reconfigure", method: POST}
    attrs:
      - {name: Enabled, type: string, key: enabled}
      - {name: IPAddress, type: string, key: ipaddr}
      - {name: Netmask, type: string, key: netmask}
      - {name: Area, type: string, key: area}
      - {name: AreaRange, type: string, key: arearange}
      - {name: PrefixListIn, type: SelectedMap, key: linkedPrefixlistIn}
      - {name: PrefixListOut, type: SelectedMap, key: linkedPrefixlistOut}

  - name: OSPF6Interface
    filename: ospf6_interface
    monad: interface
    endpoints:
      create: {path: "/quagga/ospf6settings/addInterface", method: POST}
      read: {path: "/quagga/ospf6settings/getInterface", method: GET}
      update: {path: "/quagga/ospf6settings/setInterface", method: POST}
      delete: {path: "/quagga/ospf6settings/delInterface", method: POST}
      search: {path: "/quagga/ospf6settings/searchInterface", method: POST}
      reconfigure: {path: "/quagga/service/reconfigure", method: POST}
    attrs:
      - {name: Enabled, type: string, key: enabled}
      - {name: InterfaceName, type: SelectedMap, key: interfacename}
      - {name: Area, type: string, key: area}
      - {name: Passive, type: string, key: passive}
      - {name: Cost, type: string, key: cost}
      - {name: CostDemoted, type: string, key: cost_demoted}
      - {name: CarpDependOn, type: SelectedMap, key: carp_depend_on}
      - {name: HelloInterval, type: string, key: hellointerval}
      - {name: DeadInterval, type: string, key: deadinterval}
      - {name: RetransmitInterval, type: string, key: retransmitinterval}
      - {name: TransmitDelay, type: string, key: transmitdelay}
      - {name: Priority, type: string, key: priority}
      - {name: BFD, type: string, key: bfd}
      - {name: NetworkType, type: SelectedMap, key: networktype}

rpc:
  - name: FRRGeneral
    filename: frr_general
    customTypes:
      FRRGeneralResponse:
        - {name: General, type: FRRGeneralSettings, key: general}
      FRRGeneralSettings:
        - {name: Enabled, type: string, key: enabled}
        - {name: Profile, type: SelectedMap, key: profile}
        - {name: EnableCARP, type: string, key: enablecarp}
        - {name: EnableSyslog, type: string, key: enablesyslog}
        - {name: EnableSNMP, type: string, key: enablesnmp}
        - {name: SyslogLevel, type: SelectedMap, key: sysloglevel}
        - {name: FirewallRules, type: string, key: fwrules}
    rpc_calls:
      - {name: Get, endpoint: {path: "/quagga/general/get", method: GET}, result_type: FRRGeneralResponse}
      - name: Set
        endpoint: {path: "/quagga/general/set", method: POST}
        params:
          - {name: general, optional: false, bodyParameter: true, customType: FRRGeneralSettings}
        result_type: api.ActionResult
      - {name: Reconfigure, endpoint: {path: "/quagga/service/reconfigure", method: POST}, result_type: api.ReconfigureStatusResult}

  - name: OSPFSettings
    filename: ospf_settings
    customTypes:
      OSPFSettingsResponse:
        - {name: OSPF, type: OSPFSettingsData, key: ospf}
      OSPFSettingsData:
        - {name: Enabled, type: string, key: enabled}
        - {name: CarpDemote, type: string, key: carp_demote}
        - {name: RouterID, type: string, key: routerid}
        - {name: CostReference, type: string, key: costreference}
        - {name: LogAdjacencyChanges, type: string, key: logadjacencychanges}
        - {name: Originate, type: string, key: originate}
        - {name: OriginateAlways, type: string, key: originatealways}
        - {name: OriginateMetric, type: string, key: originatemetric}
        - {name: PassiveInterfaces, type: SelectedMapList, key: passiveinterfaces}
    rpc_calls:
      - {name: Get, endpoint: {path: "/quagga/ospfsettings/get", method: GET}, result_type: OSPFSettingsResponse}
      - name: Set
        endpoint: {path: "/quagga/ospfsettings/set", method: POST}
        params:
          - {name: ospf, optional: false, bodyParameter: true, customType: OSPFSettingsData}
        result_type: api.ActionResult
      - {name: Reconfigure, endpoint: {path: "/quagga/service/reconfigure", method: POST}, result_type: api.ReconfigureStatusResult}

  - name: OSPF6Settings
    filename: ospf6_settings
    customTypes:
      OSPF6SettingsResponse:
        - {name: OSPF6, type: OSPF6SettingsData, key: ospf6}
      OSPF6SettingsData:
        - {name: Enabled, type: string, key: enabled}
        - {name: CarpDemote, type: string, key: carp_demote}
        - {name: RouterID, type: string, key: routerid}
        - {name: Originate, type: string, key: originate}
        - {name: OriginateAlways, type: string, key: originatealways}
        - {name: OriginateMetric, type: string, key: originatemetric}
    rpc_calls:
      - {name: Get, endpoint: {path: "/quagga/ospf6settings/get", method: GET}, result_type: OSPF6SettingsResponse}
      - name: Set
        endpoint: {path: "/quagga/ospf6settings/set", method: POST}
        params:
          - {name: ospf6, optional: false, bodyParameter: true, customType: OSPF6SettingsData}
        result_type: api.ActionResult
      - {name: Reconfigure, endpoint: {path: "/quagga/service/reconfigure", method: POST}, result_type: api.ReconfigureStatusResult}
